name: Owner one-shot real-provider smoke acceptance

on:
  pull_request:
    paths:
      - 'varyn/owner_provider_acceptance.py'
      - 'varyn/agent_mode_gui.py'
      - 'tests/test_owner_provider_acceptance.py'
      - 'tests/test_consumer_workspace_tk.py'
      - 'docs/OWNER-PROVIDER-SMOKE-ACCEPTANCE.md'
      - '.github/workflows/owner-provider-smoke-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile acceptance runtime and GUI
        run: python -m py_compile varyn/owner_provider_acceptance.py varyn/agent_mode_gui.py
      - name: One-shot provider acceptance tests without network
        run: python -m unittest discover -s tests -p 'test_owner_provider_acceptance.py' -v
      - name: "Regression: owner billing and prior accepted evidence"
        run: |
          python -m unittest discover -s tests -p 'test_owner_billing_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_local_evaluation_receipts.py' -v
          python -m unittest discover -s tests -p 'test_owner_live_evaluation.py' -v
          python -m unittest discover -s tests -p 'test_feedback_evaluation_scheduler.py' -v
          python -m unittest discover -s tests -p 'test_grounded_learning_bridge.py' -v

  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile acceptance runtime and GUI
        run: python -m py_compile varyn/owner_provider_acceptance.py varyn/agent_mode_gui.py
      - name: One-shot provider acceptance tests without network
        run: python -m unittest discover -s tests -p 'test_owner_provider_acceptance.py' -v
      - name: "Regression: owner billing and prior accepted evidence"
        run: |
          python -m unittest discover -s tests -p 'test_owner_billing_reconciliation.py' -v
          python -m unittest discover -s tests -p 'test_local_evaluation_receipts.py' -v
          python -m unittest discover -s tests -p 'test_owner_live_evaluation.py' -v
          python -m unittest discover -s tests -p 'test_feedback_evaluation_scheduler.py' -v
          python -m unittest discover -s tests -p 'test_grounded_learning_bridge.py' -v
      - name: Native Windows owner GUI smoke
        run: python -m unittest discover -s tests -p 'test_consumer_workspace_tk.py' -v
