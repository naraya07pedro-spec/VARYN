name: Memory prototype checks

on:
  push:
    branches: [main, feat/local-memory-prototype-20261103]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional recovery cryptography dependency
        run: python -m pip install -r requirements-recovery.txt
      - name: Compile desktop entrypoint without launching a window
        run: python -m py_compile varyn/desktop.py varyn/desktop_controller.py
      - name: Check Windows Tkinter import (no graphical session)
        if: runner.os == 'Windows'
        run: python -c "import tkinter; print('Tkinter module available')"
      - name: Unit tests (including optional audited cryptography)
        run: python -m unittest discover -s tests -v
      - name: Synthetic-only desktop boundary and disposable sample cleanup
        run: |
          python -m unittest discover -s tests -p "test_desktop_file_scope.py" -v
          python -m unittest discover -s tests -p "test_synthetic_fixture.py" -v
      - name: Idle grant expiration and cancellation regression (both OSes)
        run: python -m unittest discover -s tests -p "test_file_grant_idle_timer.py" -v
      - name: Grant-owned fixture release and idle cleanup regression (both OSes)
        run: python -m unittest discover -s tests -p "test_grant_fixture_release.py" -v
      - name: Native Windows handle containment regression (must execute)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_windows_scoped_native.py" -v
      - name: Native Windows read consistency regression (must execute)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_windows_file_consistency.py" -v
      - name: Offline official-app sync capability gate (no provider request)
        run: |
          python -m varyn.official_sync
          python -m varyn.official_sync --provider chatgpt
          python -m varyn.official_sync --provider claude
          python -m varyn.official_sync --provider gemini
      - name: Verify source-backed official app evidence remains non-dispatchable
        run: python -m unittest discover -s tests -p "test_official_app_evidence.py" -v
      - name: Synthetic-only real handle and idle expiry acceptance (not GUI)
        run: |
          python -m unittest discover -s tests -p "test_desktop_acceptance.py" -v
          python -m varyn.desktop_acceptance --synthetic-only --json
      - name: Ensure bundled Windows self-check is synthetic-only
        run: python -m unittest discover -s tests -p "test_acceptance_packaging.py" -v
      - name: Owner GUI checklist reporting is bounded and NOT independent evidence
        run: python -m unittest discover -s tests -p "test_owner_acceptance.py" -v
      - name: Real Tk widget command wiring contract (both OSes, no display required)
        run: python -m unittest discover -s tests -p "test_tk_widget_smoke.py" -v
      - name: Real Windows Tk widgets and synthetic button invocations (NOT human clicks)
        if: runner.os == 'Windows'
        run: python -m varyn.tk_widget_smoke --synthetic-only --require-display --json
      - name: Real bounded multi-model role handoff and per-stage consent regressions
        run: python -m unittest discover -s tests -p "test_collaboration.py" -v
      - name: Desktop three-role model selection and individual consent boundary
        run: python -m unittest discover -s tests -p "test_desktop_collaboration.py" -v
      - name: Project-scoped explicit synthetic local desktop memory regression
        run: python -m unittest discover -s tests -p "test_desktop_memory.py" -v
      - name: Hosted Windows Tk synthetic memory UI save/search/delete (no human clicks)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_desktop_memory_tk.py" -v
      - name: Check 17N selected memory context handoff
        run: python -m unittest discover -s tests -p "test_memory_handoff.py" -v
      - name: Windows Tk exact-selected-memory review and provenance
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_memory_handoff_tk.py" -v
      - name: Bounded 17O multi-step synthetic task planning and approval regressions
        run: python -m unittest discover -s tests -p "test_task_planner.py" -v
      - name: Real hosted Windows Tk synthetic task plan review
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_task_planner_tk.py" -v
      - name: Durable task checkpoint crash and no-replay regression
        run: python -m unittest discover -s tests -p "test_task_journal.py" -v
      - name: Offline deterministic collaborative reasoning evaluator and adversarial controls
        run: |
          python -m unittest discover -s tests -p "test_reasoning_eval.py" -v
          python -m unittest discover -s tests -p "test_reasoning_eval_desktop.py" -v
          python -m varyn.reasoning_eval
      - name: Native Windows Tk offline reasoning diagnostic button
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_reasoning_eval_tk.py" -v
      - name: 17R blinded paired study, budget-matching and multi-rater fail-closed regressions
        run: |
          python -m unittest discover -s tests -p "test_blind_benchmark.py" -v
          python -m varyn.blind_benchmark
      - name: 17S-1 reviewed synthetic file tool permission and desktop regressions
        run: python -m unittest discover -s tests -p "test_tool_gateway.py" -v
      - name: 17S-1 hosted Windows Tk button review and revoke (synthetic only)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_tool_gateway_tk.py" -v
      - name: 17S-2 public GitHub tool contract and consent regressions (no live network)
        run: python -m unittest discover -s tests -p "test_public_github_tool.py" -v
      - name: 17S-2 hosted Windows Tk network-consent/approval smoke
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_public_github_tool_tk.py" -v
      - name: 17S-3 nonblocking worker, revocation race, and untrusted result regressions
        run: python -m unittest discover -s tests -p "test_public_tool_worker.py" -v
      - name: 17S-3 hosted Windows Tk stale network result suppression
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_public_github_tool_tk.py" -v
      - name: Option C consumer-history proof gates stay blocked
        run: |
          python -m unittest discover -s tests -p "test_option_c_gate.py" -v
          python -m varyn.option_c_gate
          python -m varyn.option_c_gate --provider gemini
      - name: Offline desktop preflight and process RSS (doctor process only)
        run: python -m varyn.doctor --json
      - name: Build deterministic desktop source ZIP
        run: python -m varyn.package_desktop --output varyn-desktop-ci.zip
      - name: Inspect source ZIP entries (no DB, key, or executable)
        run: python -c "import zipfile; z=zipfile.ZipFile('varyn-desktop-ci.zip'); names=z.namelist(); assert 'VARYN/Launch-VARYN.cmd' in names; assert 'VARYN/Verify-VARYN-Synthetic.cmd' in names; assert 'VARYN/Record-VARYN-GUI-Checks.cmd' in names; assert all(n.endswith('.py') or n.endswith('.cmd') or n.endswith('.md') for n in names)"
      - name: Publish source-only Windows launcher ZIP as CI artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: varyn-windows-source-launcher
          path: varyn-desktop-ci.zip
          if-no-files-found: error
          retention-days: 7
      - name: Synthetic offline desktop Python memory probe (not process RSS)
        run: python -m varyn.desktop_perf
      - name: Synthetic performance benchmark (informational, no speed gate)
        run: python -m varyn.performance --rows 300 --repeats 5
      - name: Check memory CLI
        run: |
          python -m varyn.memory --db smoke.sqlite3 --owner demo add --project VARYN --content "checkpoint verified"
          python -m varyn.memory --db smoke.sqlite3 --owner demo search --query "checkpoint"
      - name: Check backup and restore CLI
        run: |
          python -m varyn.backup --db smoke.sqlite3 --output snapshot.sqlite3
          python -m varyn.restore --backup snapshot.sqlite3 --output recovered.sqlite3
          python -m varyn.memory --db recovered.sqlite3 --owner demo search --query "checkpoint"
