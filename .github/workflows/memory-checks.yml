  portable-windows:
    name: Portable Windows x64 bundle (unsigned, no Python installer)
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/local-memory-prototype-20261103'
    needs: unit-tests
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact committed source
        uses: actions/checkout@v4
      - name: Use supported Python x64 runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install pinned Windows packaging tool
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.22.3"
      - name: Verify pinned Windows packaging tool version
        run: python -c "import PyInstaller; assert PyInstaller.__version__ == '6.22.3', PyInstaller.__version__"
      - name: Build optional unsigned one-folder GUI executable
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name VARYN-Portable --paths . --add-data "integrations/catalog.json;integrations" varyn/portable_entry.py
      - name: Include explicit unsigned safety and no-sync owner instructions
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "README-PORTABLE.txt" -Destination "dist/VARYN-Portable/README-PORTABLE.txt"
          Copy-Item -LiteralPath "Start-VARYN-OwnerPilot.ps1" -Destination "dist/VARYN-Portable/Start-VARYN-OwnerPilot.ps1"
          if (-not (Test-Path -LiteralPath "dist/VARYN-Portable/_internal" -PathType Container)) {
            throw "PyInstaller internal Python/Tk runtime missing"
          }
          if (-not (Test-Path -LiteralPath "dist/VARYN-Portable/VARYN-Portable.exe" -PathType Leaf)) {
            throw "Portable EXE missing"
          }
      - name: 17S-44 validate bundled PowerShell owner launcher is syntactically readable without secrets
        shell: pwsh
        run: |
          $e = $null
          $t = [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content -LiteralPath "dist/VARYN-Portable/Start-VARYN-OwnerPilot.ps1" -Raw),
            [ref]$e)
          if ($e.Count -gt 0 -or $t.Count -lt 50) {
            throw "Owner launcher contains parsing errors or missing source"
          }
      - name: Generate bounded, unsigned file-by-file SHA256 inventory
        run: python -m varyn.portable_release --directory dist/VARYN-Portable --create
      - name: 17S-44 run actual bundled read-only owner launcher full SHA256 verification
        shell: pwsh
        run: |
          & "dist/VARYN-Portable/Start-VARYN-OwnerPilot.ps1" -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw "Owner pilot full manifest verification failed" }
      - name: Verify complete portable executable and runtime inventory
        run: python -m varyn.portable_release --directory dist/VARYN-Portable --verify
      - name: 17S-43 actual frozen Windows GUI synthetic model workflow and default-off model catalog (no provider requests)
        shell: pwsh
        run: |
          $exe = (Resolve-Path -LiteralPath "dist/VARYN-Portable/VARYN-Portable.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList @("--smoke-only") -WorkingDirectory (Get-Location).Path -PassThru
          if (-not $p.WaitForExit(45000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "Frozen Tk smoke hung; portable build not releasable"
          }
          if ($p.ExitCode -ne 0) {
            throw "Frozen Tk GUI smoke failed with exit code $($p.ExitCode)"
          }
      - name: 17S-34 ACTUAL frozen EXE DPAPI save then NEW PROCESS restore, no overwrite and tamper refusal
        run: python -m varyn.frozen_draft_probe --executable dist/VARYN-Portable/VARYN-Portable.exe
      - name: Verify frozen output unchanged after smoke
        run: python -m varyn.portable_release --directory dist/VARYN-Portable --verify
      - name: Publish unsigned portable Windows bundle (not signed/installer)
        uses: actions/upload-artifact@v4
        with:
          name: varyn-windows-portable
          path: dist/VARYN-Portable/
          if-no-files-found: error
          retention-days: 7

  publish-preview-release:
    name: Publish unsigned Windows alpha as GitHub prerelease
    # Only intentional release commits run this step; normal development does not publish.
    if: >
      github.event_name == 'push' &&
      github.repository == 'naraya07pedro-spec/VARYN' &&
      github.ref == 'refs/heads/feat/local-memory-prototype-20261103' &&
      startsWith(github.event.head_commit.message, 'release:')
    needs: portable-windows
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout tagged exact source
        uses: actions/checkout@v4
      - name: Set up Python for bundle manifest verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Retrieve bundle from successful same-commit workflow job
        uses: actions/download-artifact@v4
        with:
          name: varyn-windows-portable
          path: dist/VARYN-Portable
      - name: Independently check the release contents against bundled SHA256 inventory
        shell: pwsh
        run: |
          python -m varyn.portable_release --directory dist/VARYN-Portable --verify
          if ($LASTEXITCODE -ne 0) { throw "Release artifact integrity verification failed" }
          foreach ($file in @(
            'VARYN-Portable.exe',
            'BUNDLE-SHA256.json',
            'Start-VARYN-OwnerPilot.ps1',
            'README-PORTABLE.txt'
          )) {
            if (-not (Test-Path -LiteralPath "dist/VARYN-Portable/$file" -PathType Leaf)) {
              throw "Missing release file: $file"
            }
          }
      - name: Package the verified unsigned folder and generate SHA256
        shell: pwsh
        run: |
          $tag = 'v0.1.0-alpha.5'
          $zip = "VARYN-Windows-x64-$tag-unsigned.zip"
          Compress-Archive -LiteralPath 'dist/VARYN-Portable' -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'Release ZIP not created' }
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SHA256: $sha"
      - name: Create visible prerelease with exact source commit, no automatic main merge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.1.0-alpha.5'
          $sha = $env:GITHUB_SHA
          $note = @"
          Experimental unsigned Windows x64 VARYN Portable build from source commit $sha.

          Download `$env:RELEASE_ZIP`, verify its SHA-256:
          `$env:RELEASE_SHA256`

          Includes owner-reviewed model API requests, offline fake model, and manual official-app relay.
          Not production-safe, not a signed binary, not a hard billing cap, and NOT
          native two-way consumer ChatGPT/Claude/Gemini history sync.
          Run only as a normal, non-administrator Windows user; do not bypass
          Defender or SmartScreen warnings. Do not use private/customer data.

          Full source, scope, and install instructions:
          https://github.com/naraya07pedro-spec/VARYN/tree/$sha
          "@
          $note | Set-Content -LiteralPath 'release-notes-alpha.txt' -Encoding UTF8
          gh release create $tag $env:RELEASE_ZIP --target $sha --prerelease --title 'VARYN v0.1.0-alpha.5 | premium workspace, sunset edition' --notes-file 'release-notes-alpha.txt'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease publish failed' }
