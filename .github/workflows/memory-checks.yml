      - name: 17S-7 sequential public GitHub plan and per-step owner approval regression
        run: python -m unittest discover -s tests -p "test_public_repo_plan.py" -v
      - name: 17S-7 hosted Windows Tk two-step real button and no implicit approval
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_public_repo_plan_tk.py" -v
      - name: 17S-8 crash-safe public comparison journal and no replay regressions
        run: python -m unittest discover -s tests -p "test_public_comparison_journal.py" -v
      - name: 17S-9 SQLite fault injections and dispatch-no-replay on both OSes
        run: |
