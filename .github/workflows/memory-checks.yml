name: Memory prototype checks

on:
  push:
    branches: [main, feat/local-memory-prototype-20261103]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional recovery cryptography dependency
        run: python -m pip install -r requirements-recovery.txt
      - name: Compile desktop entrypoint without launching a window
        run: python -m py_compile varyn/desktop.py varyn/desktop_controller.py
      - name: Check Windows Tkinter import (no graphical session)
        if: runner.os == 'Windows'
        run: python -c "import tkinter; print('Tkinter module available')"
      - name: 17S-17/18 early native AppContainer job, kernel handle audit and approved parent fixture bridge (CI-only)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_windows_appcontainer_trial.py" -v
      - name: 17S-17 cross-platform AppContainer Job refusal and memory policy
        run: python -m unittest discover -s tests -p "test_windows_appcontainer_job.py" -v
      - name: 17S-18 trusted parent simulated approval, fixture tamper, revocation and replay
        run: python -m unittest discover -s tests -p "test_parent_synthetic_read_broker.py" -v
      - name: 17S-20 owner synthetic desktop consent and broker regression
        run: python -m unittest discover -s tests -p "test_desktop_parent_counts*.py" -v
      - name: 17S-21 Windows native small-viewport scroll and consent reachability
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_desktop_scroll_tk.py" -v
      - name: 17S-21 owner acceptance self-report is not machine-attested
        run: python -m unittest discover -s tests -p "test_owner_acceptance.py" -v
      - name: 17S-22 offline official-app user-mediated relay contracts (NO app access)
        run: |
          python -m unittest discover -s tests -p "test_official_manual_relay.py" -v
          python -m unittest discover -s tests -p "test_official_manual_relay_desktop.py" -v
      - name: 17S-22 hosted Windows real Tk manual relay and scrollable consent review
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_official_manual_relay_tk.py" -v
      - name: 17S-23 official consumer URL, post-review clipboard and owner pilot contracts
        run: |
          python -m unittest discover -s tests -p "test_official_manual_relay.py" -v
          python -m unittest discover -s tests -p "test_official_manual_relay_desktop.py" -v
          python -m unittest discover -s tests -p "test_official_relay_pilot.py" -v
      - name: 17S-23 hosted Windows actual Tk official homepage launch consent
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_official_relay_open_tk.py" -v
      - name: 17S-24 exact bound return receipt and nested review adversarial checks
        run: |
          python -m unittest discover -s tests -p "test_official_return_receipt.py" -v
          python -m unittest discover -s tests -p "test_official_manual_relay_desktop.py" -v
      - name: 17S-24 native Windows Tk outbound-bound reply consent presentation
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_official_manual_relay_tk.py" -v
      - name: 17S-25 owner-reviewed project RAM notes, conflicts and explicit opt-in
        run: |
          python -m unittest discover -s tests -p "test_relay_working_context.py" -v
          python -m unittest discover -s tests -p "test_official_manual_relay_desktop.py" -v
      - name: 17S-25 native Windows Tk working context owner review, copy and discard
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_relay_working_context_tk.py" -v
      - name: 17S-26 one-click owner Windows pilot contracts (no real app login)
        run: |
          python -m unittest discover -s tests -p "test_owner_pilot_launcher.py" -v
          python -m unittest discover -s tests -p "test_desktop_packaging.py" -v
          python -m unittest discover -s tests -p "test_acceptance_packaging.py" -v
